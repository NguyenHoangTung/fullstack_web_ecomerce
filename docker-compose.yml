version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ecommerce_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_db}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/data.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  be:
    build:
      context: ./be
    container_name: ecommerce_be
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://db:3306/ecommerce_db?allowPublicKeyRetrieval=true&useSSL=false}
      DB_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-local_dev_password}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-32chars}

  fe:
    build:
      context: ./fe
    container_name: ecommerce_fe
    ports:
      - "80:80"
    depends_on:
      - be

volumes:
  db_data:
